services:
  - type: web
    name: bio-nexus-api
    runtime: python
    region: ohio
    buildCommand: bash build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGIN
        value: "https://bio-nexus-samadsaifi14s-projects.vercel.app,https://bio-nexus.vercel.app,https://bioai-platform.vercel.app"
      - key: NCBI_API_KEY
        sync: false
      - key: NCBI_EMAIL
        value: "bioflow@example.com"
      # Ensure the in-process durable worker starts so queued jobs (BLAST,
      # docking, NGS, MD) are always claimed. Without this the worker can be
      # silently disabled and every job stays stuck in "queued".
      - key: RUN_WORKER
        value: "true"
