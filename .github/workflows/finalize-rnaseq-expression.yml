name: finalize RNA-seq expression implementation

on:
  push:
    branches:
      - feature/rnaseq-deseq2-execution-2026-09-12

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: feature/rnaseq-deseq2-execution-2026-09-12
      - name: Apply final RNA-seq reproducibility patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected marker in {path}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # R execution: expose every important intermediate decision and always
          # generate an authentic expression heatmap with an explicit selection basis.
          r = Path('bioai-platform/backend/app/rnaseq/deseq2_analysis.R')
          text = r.read_text(encoding='utf-8')
          if 'model_metadata.tsv' not in text:
              text = text.replace(
                  'design_terms <- unique(c(covariates, condition_col))',
                  'model_meta_export <- data.frame(sample = rownames(meta), meta, check.names = FALSE, row.names = NULL)\nwrite.table(model_meta_export, file.path(outdir, "model_metadata.tsv"), sep = "\\t", quote = FALSE, row.names = FALSE)\n\ndesign_terms <- unique(c(covariates, condition_col))',
                  1,
              )
          if 'prefilter_decisions.tsv' not in text:
              text = text.replace(
                  'keep <- rowSums(counts(dds) >= min_count) >= min_samples\ndds <- dds[keep, ]',
                  'qualifying_samples <- rowSums(counts(dds) >= min_count)\nkeep <- qualifying_samples >= min_samples\nprefilter_df <- data.frame(gene = rownames(dds), qualifying_samples = as.integer(qualifying_samples), kept = as.logical(keep), row.names = NULL)\nwrite.table(prefilter_df, file.path(outdir, "prefilter_decisions.tsv"), sep = "\\t", quote = FALSE, row.names = FALSE)\ndds <- dds[keep, ]',
                  1,
              )
          if 'library_sizes.tsv' not in text:
              marker = 'write.table(data.frame(gene = rownames(normalized), normalized, check.names = FALSE), file.path(outdir, "normalized_counts.tsv"), sep = "\\t", quote = FALSE, row.names = FALSE)'
              replacement = marker + '\nlibrary_sizes <- data.frame(sample = colnames(dds), raw_input_library_size = as.numeric(colSums(counts)[colnames(dds)]), retained_raw_library_size = as.numeric(colSums(counts(dds))), normalized_retained_library_sum = as.numeric(colSums(normalized)), size_factor = as.numeric(size_factors), row.names = NULL)\nwrite.table(library_sizes, file.path(outdir, "library_sizes.tsv"), sep = "\\t", quote = FALSE, row.names = FALSE)'
              if marker not in text:
                  raise SystemExit('normalized-count marker missing')
              text = text.replace(marker, replacement, 1)

          start = text.find('heatmap_written <- FALSE')
          end = text.find('\nsummary <- list(', start)
          if start == -1 or end == -1:
              raise SystemExit('expression heatmap block markers missing')
          heatmap_block = '''heatmap_written <- FALSE
heatmap_basis <- "none"
heatmap_gene_count <- 0L
vst_matrix <- assay(vsd)
gene_variance <- apply(vst_matrix, 1, var)

if (nrow(deg_df) >= 2) {
  ordered <- deg_df[order(deg_df$padj, -abs(deg_df$log2FoldChange), na.last = TRUE), , drop = FALSE]
  selected_genes <- head(ordered$gene, top_heatmap_genes)
  heatmap_basis <- "significant_DE_genes"
} else {
  variance_order <- names(sort(gene_variance, decreasing = TRUE, na.last = NA))
  selected_genes <- head(variance_order, min(top_heatmap_genes, length(variance_order)))
  heatmap_basis <- "top_variable_genes_QC"
}

if (length(selected_genes) >= 2) {
  hm <- vst_matrix[selected_genes, , drop = FALSE]
  hm_z <- t(scale(t(hm)))
  hm_z[!is.finite(hm_z)] <- 0
  heatmap_gene_count <- nrow(hm_z)
  write.table(data.frame(gene = rownames(hm_z), hm_z, check.names = FALSE), file.path(outdir, "heatmap_matrix_zscore.tsv"), sep = "\\t", quote = FALSE, row.names = FALSE)
  result_index <- match(selected_genes, res_df$gene)
  selection_df <- data.frame(
    gene = selected_genes,
    selection_basis = rep(heatmap_basis, length(selected_genes)),
    rank = seq_along(selected_genes),
    vst_variance = as.numeric(gene_variance[selected_genes]),
    padj = res_df$padj[result_index],
    log2FoldChange = res_df$log2FoldChange[result_index],
    row.names = NULL
  )
  write.table(selection_df, file.path(outdir, "heatmap_gene_selection.tsv"), sep = "\\t", quote = FALSE, row.names = FALSE, na = "")
  expr_col <- colorRamp2(c(-2, 0, 2), c("#1E3A5F", "#F8FAFC", "#9A3412"))
  heatmap_title <- if (heatmap_basis == "significant_DE_genes") {
    paste0("Top ", nrow(hm_z), " significant DE genes by adjusted p-value")
  } else {
    paste0("Top ", nrow(hm_z), " variable genes (VST QC; not DEG calls)")
  }
  plot_svg_pdf_png("expression_heatmap", 9, max(6, min(12, 4 + nrow(hm_z) * 0.12)), function() draw(Heatmap(hm_z, name = "row z-score", col = expr_col, top_annotation = ha, cluster_rows = TRUE, cluster_columns = TRUE, column_title = heatmap_title, row_names_gp = gpar(fontsize = 7), column_names_gp = gpar(fontsize = 7))))
  heatmap_written <- TRUE
}
'''
          text = text[:start] + heatmap_block + text[end:]
          text = text.replace(
              '  expression_heatmap_generated = heatmap_written,',
              '  expression_heatmap_generated = heatmap_written,\n  expression_heatmap_basis = heatmap_basis,\n  expression_heatmap_genes = heatmap_gene_count,',
              1,
          )
          if 'session_info.txt' not in text:
              marker = 'write(toJSON(summary, auto_unbox = TRUE, pretty = TRUE, null = "null", digits = 10), file.path(outdir, "analysis_summary.json"))'
              text = text.replace(marker, marker + '\nwriteLines(capture.output(sessionInfo()), file.path(outdir, "session_info.txt"))', 1)
          r.write_text(text, encoding='utf-8')

          # Backend manifest should know how to serve the new text provenance artifact.
          expr = Path('bioai-platform/backend/app/rnaseq/expression.py')
          text = expr.read_text(encoding='utf-8')
          if '".txt": "text/plain; charset=utf-8"' not in text:
              text = text.replace('    ".png": "image/png",\n}', '    ".png": "image/png",\n    ".txt": "text/plain; charset=utf-8",\n}', 1)
          expr.write_text(text, encoding='utf-8')

          # Type the new deterministic fields and artifact digest.
          api = Path('bioai-platform/frontend/src/lib/rnaseqExpressionApi.ts')
          text = api.read_text(encoding='utf-8')
          if 'sha256: string;' not in text:
              text = text.replace('  bytes: number;\n  url: string;', '  bytes: number;\n  sha256: string;\n  url: string;', 1)
          if 'expression_heatmap_basis:' not in text:
              text = text.replace('  expression_heatmap_generated: boolean;', "  expression_heatmap_generated: boolean;\n  expression_heatmap_basis: 'significant_DE_genes' | 'top_variable_genes_QC' | 'none';\n  expression_heatmap_genes: number;", 1)
          api.write_text(text, encoding='utf-8')

          # UI: state exactly why the heatmap exists and whether it is inferential or QC.
          workspace = Path('bioai-platform/frontend/src/components/results/RnaSeqExpressionWorkspace.tsx')
          text = workspace.read_text(encoding='utf-8')
          if "const heatmapTitle =" not in text:
              marker = "  const heatmapData = artifact(result, 'heatmap_matrix_zscore.tsv');"
              addition = marker + "\n  const heatmapSelection = artifact(result, 'heatmap_gene_selection.tsv');\n  const heatmapTitle = summary?.expression_heatmap_basis === 'significant_DE_genes' ? 'Top differential genes' : 'Top variable genes (QC)';\n  const heatmapSubtitle = summary?.expression_heatmap_basis === 'significant_DE_genes'\n    ? 'ComplexHeatmap generated from row-z-scored VST values for significant genes ranked by adjusted p-value. The exact plotted matrix and gene-selection evidence are downloadable.'\n    : 'ComplexHeatmap generated from the highest-variance VST genes because fewer than two genes met the declared DEG thresholds. This is a QC/exploratory view, not a list of differential-expression calls.';"
              if marker not in text:
                  raise SystemExit('workspace heatmap marker missing')
              text = text.replace(marker, addition, 1)
          text = text.replace(
              '<FigureCard title="Top differential genes" subtitle="ComplexHeatmap generated from row-z-scored VST values for the top significant genes ranked by adjusted p-value. The exact plotted matrix is downloadable." image={heatmap} data={heatmapData} onExpand={setExpanded} />',
              '<FigureCard title={heatmapTitle} subtitle={heatmapSubtitle} image={heatmap} data={heatmapData ?? heatmapSelection} onExpand={setExpanded} />',
              1,
          )
          text = text.replace("'Run SALS validation subset'", "'Run SALS DESeq2 demo'")
          text = text.replace(
              'The bundled demonstration is a deterministic every-100th-gene subset of the course-supplied cerebellum count matrix. It preserves all 18 samples and the real counts; upload the full matrix below to reproduce the full practical.',
              'The bundled demonstration is a deterministic every-100th-gene execution fixture from the user-supplied cerebellum count matrix. It preserves all 18 samples and their real counts, but it is not a substitute for full-study inference; upload the full matrix below to reproduce the complete practical.',
              1,
          )
          workspace.write_text(text, encoding='utf-8')

          # Make the dependency direct, not merely transitive.
          docker = Path('bioai-platform/backend/Dockerfile')
          text = docker.read_text(encoding='utf-8')
          if 'r-cran-jsonlite r-cran-circlize' not in text:
              text = text.replace('r-cran-jsonlite &&', 'r-cran-jsonlite r-cran-circlize &&', 1)
          if 'library(jsonlite); library(circlize)' not in text:
              text = text.replace('library(ggplot2); library(jsonlite)}', 'library(ggplot2); library(jsonlite); library(circlize)}', 1)
          docker.write_text(text, encoding='utf-8')

          # Strengthen the already-working real R regression.
          rci = Path('.github/workflows/rnaseq-expression-ci.yml')
          text = rci.read_text(encoding='utf-8')
          if 'r-cran-jsonlite r-cran-circlize' not in text:
              text = text.replace('r-bioc-complexheatmap r-cran-ggplot2 r-cran-jsonlite', 'r-bioc-complexheatmap r-cran-ggplot2 r-cran-jsonlite r-cran-circlize', 1)
          if 'library(jsonlite); library(circlize)' not in text:
              text = text.replace('library(ggplot2); library(jsonlite)}', 'library(ggplot2); library(jsonlite); library(circlize)}', 1)
          text = text.replace(
              "              'size_factors.tsv', 'normalized_counts.tsv', 'pca_coordinates.tsv',",
              "              'size_factors.tsv', 'library_sizes.tsv', 'normalized_counts.tsv', 'prefilter_decisions.tsv', 'model_metadata.tsv', 'pca_coordinates.tsv',",
              1,
          )
          if "'session_info.txt'" not in text:
              text = text.replace("              'ma_plot.png', 'volcano.svg', 'volcano.pdf', 'volcano.png',", "              'ma_plot.png', 'volcano.svg', 'volcano.pdf', 'volcano.png', 'session_info.txt',", 1)
          old_conditional = '''          if summary['expression_heatmap_generated']:
              for name in ('heatmap_matrix_zscore.tsv', 'expression_heatmap.svg', 'expression_heatmap.pdf', 'expression_heatmap.png'):
                  path = out / name
                  assert path.exists() and path.stat().st_size > 0, name'''
          new_heatmap_assert = '''          assert summary['expression_heatmap_generated'] is True, summary
          assert summary['expression_heatmap_basis'] in {'significant_DE_genes', 'top_variable_genes_QC'}, summary
          assert summary['expression_heatmap_genes'] >= 2, summary
          for name in ('heatmap_matrix_zscore.tsv', 'heatmap_gene_selection.tsv', 'expression_heatmap.svg', 'expression_heatmap.pdf', 'expression_heatmap.png'):
              path = out / name
              assert path.exists() and path.stat().st_size > 0, name'''
          if old_conditional not in text:
              raise SystemExit('R CI heatmap assertion marker missing')
          text = text.replace(old_conditional, new_heatmap_assert, 1)
          rci.write_text(text, encoding='utf-8')

          # Include the static RNA contract in the general backend regression suite.
          bci = Path('.github/workflows/backend-ci.yml')
          text = bci.read_text(encoding='utf-8')
          if 'tests/test_rnaseq_expression_contract.py' not in text:
              text = text.replace('            tests/test_ngs_guided_pipeline.py \\\n            -q', '            tests/test_ngs_guided_pipeline.py \\\n            tests/test_rnaseq_expression_contract.py \\\n            -q', 1)
          bci.write_text(text, encoding='utf-8')
          PY

          git rm -f .github/workflows/apply-rnaseq-completion.yml .github/workflows/finalize-rnaseq-expression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bioai-platform .github/workflows
          git commit -m "feat(rnaseq): finalize reproducible R expression outputs"
          git push origin HEAD:feature/rnaseq-deseq2-execution-2026-09-12
