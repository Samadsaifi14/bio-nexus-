name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read

jobs:
  deploy-backend:
    name: Deploy Backend to HuggingFace Spaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U huggingface_hub
          hf upload Samad14/bio-nexus-api bioai-platform/backend --repo-type space --exclude "**/.env" --exclude "**/.env.deploy" --exclude "**/__pycache__/**"
      - name: Verify backend health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 15 \
              https://samad14-bio-nexus-api.hf.space/health \
              | grep -q '"status":"ok"'; then
              echo "BioNexus backend health check passed"
              exit 0
            fi
            sleep 10
          done
          echo "Backend did not become healthy after deployment"
          exit 1

  deploy-frontend:
    name: Verify production frontend deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the canonical Vercel project to deploy this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..40}; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '.statuses[] | select(.context == "Vercel – bio-nexus") | .state' | head -n 1)"
            case "$state" in
              success) echo "Canonical Vercel deployment succeeded for $GITHUB_SHA"; exit 0 ;;
              failure|error) echo "Canonical Vercel deployment failed for $GITHUB_SHA"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for canonical Vercel deployment of $GITHUB_SHA"
          exit 1
      - name: Verify public frontend response
        run: |
          curl --fail --silent --show-error --max-time 20 \
            https://bio-nexus-ebon.vercel.app/ \
            -o /tmp/bionexus-home.html
          test -s /tmp/bionexus-home.html
          curl --fail --silent --show-error --max-time 20 \
            https://bio-nexus-ebon.vercel.app/robots.txt \
            -o /tmp/bionexus-robots.txt
          test -s /tmp/bionexus-robots.txt
