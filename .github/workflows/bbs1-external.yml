name: BBS-1 external reference benchmarks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-concordance:
    name: ADMET, UniProt, RCSB, BLAST, Primer3 and MSA concordance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bioai-platform/backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install --upgrade pip httpx rdkit primer3-py python-dotenv redis pydantic fastapi requests
      - name: Run external/reference concordance experiment
        env:
          PYTHONPATH: .
        run: python ../../benchmark/bbs1/run_reference_concordance.py --output ../../benchmark/bbs1/results/reference_concordance.json
      - name: Show retained benchmark artifact content
        if: always()
        run: cat ../../benchmark/bbs1/results/reference_concordance.json || true
