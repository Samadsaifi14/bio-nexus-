name: Manuscript UI evidence capture
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manuscript-ui-capture.yml'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          mkdir -p /tmp/bionexus-capture
          cd /tmp/bionexus-capture
          npm init -y
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture deployed public UI
        env:
          TARGET_URL: https://bio-nexus-ebon.vercel.app/
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p manuscript-evidence
          cat > /tmp/bionexus-capture/capture.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          (async () => {
            const out = path.resolve(process.cwd(), 'manuscript-evidence');
            fs.mkdirSync(out, {recursive: true});
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:2});
            const url = process.env.TARGET_URL;
            const report = {url,commit:process.env.GITHUB_SHA,recorded_at:new Date().toISOString(),kind:'UI_ONLY_NOT_SCIENTIFIC_VALIDATION'};
            try {
              const response = await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(3500);
              report.http_status = response?.status() ?? null;
              report.final_url = page.url();
              report.title = await page.title();
              report.heading = await page.locator('h1').allTextContents();
              await page.screenshot({path:path.join(out,'homepage.png'),fullPage:true,animations:'disabled'});
              fs.writeFileSync(path.join(out,'homepage.html'),await page.content());

              const blast = await browser.newPage({viewport:{width:1440,height:900}});
              const b = {url:new URL('/analyze/blast',url).toString(),stage:'navigation'};
              const responses = [];
              blast.on('response',x=>{if(x.url().includes('/api/pipelines/run'))responses.push({status:x.status(),url:x.url()})});
              try {
                const nav = await blast.goto(b.url,{waitUntil:'domcontentloaded',timeout:60000});
                await blast.waitForTimeout(2000);
                b.http_status = nav?.status() ?? null;
                await blast.screenshot({path:path.join(out,'blast-before.png'),fullPage:true});
                await blast.getByRole('button',{name:'Load p53 (human)'}).click({timeout:15000});
                b.stage='demo-loaded';
                await blast.screenshot({path:path.join(out,'blast-demo-loaded.png'),fullPage:true});
                await blast.getByRole('button',{name:'Continue'}).click();
                b.stage='confirmation';
                await blast.screenshot({path:path.join(out,'blast-confirmation.png'),fullPage:true});
                const buttons = await blast.getByRole('button').allTextContents();
                b.confirmation_buttons=buttons.slice(-12);
                // Do not submit until the confirmation control is identified reliably.
                b.success = true;
              } catch(e) {
                b.success=false;b.error=String(e);
                try{await blast.screenshot({path:path.join(out,'blast-failure.png'),fullPage:true})}catch{}
              } finally {report.blast=b;await blast.close()}

              // Broad feature inventory: capture every public analysis route independently.
              report.features = [];
              const routes = [
                'blast','ngs','docking','md','msa','phylo','domains','primers',
                'alignment','structure','pathway','enrichment','admet','function',
                'interactions','rnaseq','geo','sequencing','protein'
              ];
              for(const feature of routes){
                const tab = await browser.newPage({viewport:{width:1440,height:900}});
                const entry = {feature,url:new URL('/analyze/'+feature,url).toString()};
                try{
                  const nav = await tab.goto(entry.url,{waitUntil:'domcontentloaded',timeout:25000});
                  await tab.waitForTimeout(800);
                  entry.status=nav?.status()??null;
                  entry.final_url=tab.url();
                  entry.title=await tab.title();
                  entry.headings=(await tab.locator('h1,h2').allTextContents()).slice(0,12);
                  entry.body_excerpt=(await tab.locator('body').innerText()).slice(0,500);
                  entry.available=entry.status===200 && !/404|not found/i.test(entry.headings.join(' '));
                  await tab.screenshot({path:path.join(out,'feature-'+feature+'.png'),fullPage:true,animations:'disabled'});
                }catch(e){entry.error=String(e);entry.available=false}
                finally{report.features.push(entry);await tab.close()}
              }
              report.capture_success = true;
            } catch (e) {
              report.capture_success = false; report.error = String(e);
              try { await page.screenshot({path:path.join(out,'failure.png'),fullPage:true}); } catch {}
            } finally {
              await browser.close();
              report.files = {};
              for(const name of fs.readdirSync(out)){
                const file=path.join(out,name);
                if(fs.statSync(file).isFile()) report.files[name]=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
              }
              fs.writeFileSync(path.join(out,'manifest.json'),JSON.stringify(report,null,2));
              console.log(JSON.stringify(report,null,2));
            }
            if(!report.capture_success || (report.http_status||0)>=400 || !report.blast?.success)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node /tmp/bionexus-capture/capture.cjs
      - name: Upload screenshots and manifest even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-ui-evidence
          path: manuscript-evidence/
          if-no-files-found: warn
          retention-days: 30
