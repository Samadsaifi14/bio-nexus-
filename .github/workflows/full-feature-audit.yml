name: full-feature-audit

on:
  push:
    branches:
      - main
    paths:
      - 'benchmark/**'
      - 'bioai-platform/backend/**'
      - 'bioai-platform/frontend/**'
      - '.github/workflows/full-feature-audit.yml'
      - 'scripts/run_feature_audit.py'
      - 'scripts/audit_pytest_plugin.py'
  pull_request:
    paths:
      - 'benchmark/**'
      - 'bioai-platform/backend/**'
      - 'bioai-platform/frontend/**'
      - '.github/workflows/full-feature-audit.yml'
      - 'scripts/run_feature_audit.py'
      - 'scripts/audit_pytest_plugin.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-blast-reference:
    name: Native BLAST and complete Swiss-Prot recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: bioai-platform/backend
      BIONEXUS_BLAST_DB_ROOT: /tmp/bionexus-swissprot-ci
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-placeholder
      SUPABASE_SERVICE_ROLE_KEY: test-placeholder
      JWT_SECRET: test-placeholder
      OPENMM_CPU_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bioai-platform/backend/requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ncbi-blast+
          pip install -r bioai-platform/backend/requirements.txt pytest-asyncio pytest-timeout
      - name: Verify the actual BLAST executable and local routing
        run: |
          blastp -version
          makeblastdb -version
          python -m pytest bioai-platform/backend/tests/test_local_blast.py -vv --timeout=60 --timeout-method=signal
      - name: Provision and fingerprint the complete reference
        run: python bioai-platform/backend/scripts/provision_local_blast.py "$BIONEXUS_BLAST_DB_ROOT"
      - name: Execute production accession-recovery controls
        run: python bioai-platform/backend/scripts/check_local_blast_reference.py "$BIONEXUS_BLAST_DB_ROOT" "$RUNNER_TEMP/local-blast-evidence" benchmark/fixtures/sequence/blast_queries.json
      - name: Retain reference identity, queries and native outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-blast-reference-evidence
          path: ${{ runner.temp }}/local-blast-evidence
          if-no-files-found: error


  statistics-interpretation:
    name: Statistics and interpretation regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bioai-platform/backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-placeholder
      SUPABASE_SERVICE_ROLE_KEY: test-placeholder
      JWT_SECRET: test-placeholder
      OPENMM_CPU_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bioai-platform/backend/requirements.txt
      - run: pip install -r requirements.txt pytest-timeout pytest-asyncio
      - run: python -m pytest tests/test_stats_engine.py tests/test_worker_claim.py tests/test_dashboard.py tests/test_admet_definitions.py tests/test_audit_admet_validity.py tests/test_smoke_admet.py tests/test_de_novo_branch.py tests/test_blast_false_denovo_guard.py tests/test_ncbi_wallclock_budget.py tests/test_interactions_contract.py tests/test_structure_metric_missingness.py tests/test_md_advanced_analysis.py tests/test_smoke_docking.py tests/test_smoke_function_predict.py tests/test_smoke_md.py tests/test_auth.py tests/test_tool_interpreter.py tests/test_interpret_stream_grounding.py -vv --timeout=60 --timeout-method=signal

  fixture-diagnostics:
    name: Fixture integrity and pinned descriptor diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bioai-platform/backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: pip install pytest rdkit==2026.9.1
      - run: python -m pytest tests/test_bbs2_fixtures.py::test_fixture_manifest_has_no_drift tests/test_bbs2_fixtures.py::test_descriptor_parity_passes tests/test_bbs2_fixtures.py::test_descriptor_parity_record_persisted -vv --tb=long --noconftest -o addopts=''

  descriptor-migration-evidence:
    name: Capture descriptor version migration evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: pip install rdkit==2026.9.1
      - run: |
          python benchmark/fixtures/cheminformatics/descriptor_parity/run_descriptor_parity.py || test "$?" = 1
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("benchmark/results/cheminformatics/descriptor_parity/latest.json")
          run = json.loads(path.read_text())
          print("DESCRIPTOR_MIGRATION_EVIDENCE=" + json.dumps({
              "runtime": run["live_environments"], "reference": run["reference_pin"],
              "failures": run["failures"], "n_compared": run["n_compared"],
              "n_matched": run["n_matched"], "parse_permille": run["parse_permille"],
          }, sort_keys=True))
          PY

  backend-full-suite:
    name: Backend full pytest suite
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: bioai-platform/backend
    env:
      PYTHONHASHSEED: '0'
      BIONEXUS_AUDIT_SEED: '20260916'
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: test-placeholder
      SUPABASE_SERVICE_ROLE_KEY: test-placeholder
      JWT_SECRET: test-placeholder
      OPENMM_CPU_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bioai-platform/backend/requirements.txt
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl jq ncbi-blast+ r-base-core r-bioc-deseq2 r-bioc-complexheatmap r-bioc-tximport r-cran-ggplot2 r-cran-jsonlite r-cran-circlize
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-timeout pytest-asyncio
      - name: Provision complete Swiss-Prot for production routing
        run: python scripts/provision_local_blast.py "$RUNNER_TEMP/audit-swissprot"
      - name: Collect complete backend suite
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m pytest --basetemp="$GITHUB_WORKSPACE/pytest-full-work" --collect-only -q 2>&1 | tee /tmp/bionexus-pytest-collection.txt
          status=${PIPESTATUS[0]}
          echo "pytest collection exit status: ${status}"
          if [ "${status}" -ne 0 ]; then
            echo "--- collection failure tail ---"
            tail -n 120 /tmp/bionexus-pytest-collection.txt
          fi
          exit "${status}"
      - name: Diagnose fixture integrity and descriptor parity
        continue-on-error: true
        run: |
          python -m pytest tests/test_bbs2_fixtures.py -vv --tb=long --timeout=90 --timeout-method=signal
      - name: Run every backend module with independent deadlines and reports
        env:
          BIONEXUS_BLAST_DB_ROOT: ${{ runner.temp }}/audit-swissprot
        run: python ../../scripts/run_feature_audit.py --outdir "$RUNNER_TEMP/full-feature-audit" --module-seconds 2400 --case-seconds 900
      - name: Retain full-suite test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-feature-audit-tests
          path: |
            ${{ runner.temp }}/full-feature-audit/
            !${{ runner.temp }}/full-feature-audit/work/**
          if-no-files-found: error
      - name: Validate benchmark and engine registry
        run: python scripts/ci_validate.py

  frontend-build:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bioai-platform/frontend
    env:
      BIONEXUS_LOCAL_VERIFY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-placeholder
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bioai-platform/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Interpretation and plot evidence contracts
        run: npm run test:interpretation && npm run test:rnaseq-plots
      - name: Production build
        run: npm run build

  audit-static-contracts:
    name: Static scientific-contract audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Reject non-finite or fabricated placeholders in retained benchmark summaries
        run: |
          python - <<'PY'
          import json, math, pathlib, sys
          roots = [pathlib.Path('benchmark'), pathlib.Path('bioai-platform/backend/benchmark')]
          problems = []
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*.json'):
                  try:
                      obj = json.loads(p.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  stack = [([], obj)]
                  while stack:
                      path, value = stack.pop()
                      if isinstance(value, dict):
                          stack.extend((path+[str(k)], v) for k, v in value.items())
                      elif isinstance(value, list):
                          stack.extend((path+[str(i)], v) for i, v in enumerate(value))
                      elif isinstance(value, float) and not math.isfinite(value):
                          problems.append(f'{p}:{".".join(path)} non-finite={value!r}')
          if problems:
              print('\n'.join(problems))
              sys.exit(1)
          print('Retained JSON benchmark summaries contain no NaN/Inf values.')
          PY
      - name: Ensure synthetic/demo boundaries remain explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
            'docs/NGS_BENCHMARK_STATUS.md': ['synthetic', 'GIAB'],
            'benchmark/BBS1_PROTOCOL.md': ['integration', 'underlying'],
          }
          missing=[]
          for fn, terms in checks.items():
              p=Path(fn)
              if not p.exists():
                  missing.append(f'{fn}: missing file')
                  continue
              text=p.read_text(encoding='utf-8', errors='ignore').lower()
              for t in terms:
                  if t.lower() not in text:
                      missing.append(f'{fn}: missing boundary term {t!r}')
          if missing:
              raise SystemExit('\n'.join(missing))
          print('Scientific claim-boundary markers present.')
          PY
