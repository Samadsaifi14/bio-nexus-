<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
<title id="title">Figure V. BioNexus benchmark maturity ladder</title><desc id="desc">Five-stage maturity ladder from defined through regression with a scientific validation boundary between executable and validated.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}.h{font-size:34px;font-weight:700}.s{font-size:22px;font-weight:700}.b{font-size:17px}.m{font-size:15px;fill:#4b5563}.box{fill:#fff;stroke:#263238;stroke-width:2}.early{fill:#f5f7f8;stroke:#607d8b;stroke-width:2}.valid{fill:#eef7f4;stroke:#26695c;stroke-width:2}.gate{stroke:#9b2c2c;stroke-width:4;stroke-dasharray:14 10}.arrow{stroke:#263238;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#263238"/></marker></defs>
<text x="90" y="70" class="h">Benchmark maturity is not binary</text><text x="90" y="105" class="m">BioNexus separates having a benchmark definition from having reproducible evidence that passed it.</text>

<rect x="90" y="250" width="280" height="230" rx="18" class="early"/><text x="125" y="305" class="s">DEFINED</text><text x="125" y="350" class="b">Question + metric</text><text x="125" y="385" class="b">Acceptance rule</text><text x="125" y="420" class="m">No result implied</text>
<rect x="410" y="250" width="280" height="230" rx="18" class="early"/><text x="445" y="305" class="s">FIXTURE-READY</text><text x="445" y="350" class="b">Versioned input</text><text x="445" y="385" class="b">Expected output + hashes</text><text x="445" y="420" class="m">Still not executed</text>
<rect x="730" y="250" width="280" height="230" rx="18" class="early"/><text x="765" y="305" class="s">EXECUTABLE</text><text x="765" y="350" class="b">End-to-end run works</text><text x="765" y="385" class="b">Raw outputs retained</text><text x="765" y="420" class="m">Scientific result pending</text>
<rect x="1050" y="250" width="280" height="230" rx="18" class="valid"/><text x="1085" y="305" class="s">VALIDATED</text><text x="1085" y="350" class="b">Persisted run passes</text><text x="1085" y="385" class="b">Predeclared criterion</text><text x="1085" y="420" class="m">Reportable evidence</text>
<rect x="1370" y="250" width="280" height="230" rx="18" class="valid"/><text x="1405" y="305" class="s">REGRESSION</text><text x="1405" y="350" class="b">Validation enforced</text><text x="1405" y="385" class="b">in continuous integration</text><text x="1405" y="420" class="m">Future drift detected</text>
<path d="M370 365 H410" class="arrow"/><path d="M690 365 H730" class="arrow"/><path d="M1010 365 H1050" class="arrow"/><path d="M1330 365 H1370" class="arrow"/>
<line x1="1030" y1="180" x2="1030" y2="560" class="gate"/><text x="1050" y="195" class="s" fill="#9b2c2c">Scientific validation boundary</text>

<rect x="260" y="640" width="1280" height="150" rx="18" class="box"/><text x="300" y="690" class="s">Publication rule</text><text x="300" y="730" class="b">Only VALIDATED or REGRESSION artifacts can support quantitative performance claims.</text><text x="300" y="765" class="m">DEFINED, FIXTURE-READY and EXECUTABLE stages are engineering maturity, not biological accuracy.</text>
</svg>