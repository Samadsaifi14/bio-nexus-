name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to HuggingFace Spaces
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U huggingface_hub
          hf upload Samad14/bio-nexus-api bioai-platform/backend --repo-type space --exclude "**/.env" --exclude "**/.env.deploy" --exclude "**/__pycache__/**"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bioai-platform/frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_y6MYl4hpatRBHMHSwAzCzQ5f
      VERCEL_PROJECT_ID: prj_ylJFEbddC3dQsqLVsKyhMWDMHqeG
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reset and pin Vercel project link
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Pull production project settings
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build production frontend
        run: npx vercel build --prod --token "$VERCEL_TOKEN"
      - name: Deploy production frontend
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
