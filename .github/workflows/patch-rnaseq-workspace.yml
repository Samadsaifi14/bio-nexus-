name: wire RNA-seq expression workspace

on:
  push:
    branches:
      - feature/rnaseq-deseq2-execution-2026-09-12

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feature/rnaseq-deseq2-execution-2026-09-12
      - name: Wire real expression analysis into the RNA tab
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('bioai-platform/frontend/src/components/ngs/GuidedNgsWorkspace.tsx')
          text = path.read_text(encoding='utf-8')
          old_import = "import { RnaSeqProductionSupportCard } from '@/components/results/RnaSeqProductionSupportCard';"
          new_import = old_import + "\nimport { RnaSeqExpressionWorkspace } from '@/components/results/RnaSeqExpressionWorkspace';"
          if text.count(old_import) != 1:
              raise SystemExit('RNA production import match failed')
          text = text.replace(old_import, new_import)
          old = '''        <>\n          <div className="rounded-xl border border-warn/20 bg-warn/5 p-4 text-xs leading-5 text-text-secondary"><Warning className="mr-2 inline h-4 w-4 text-warn" /><strong className="text-text-primary">No fake RNA heatmap is shown here.</strong> PCA, sample-distance heatmap, volcano plot and expression heatmap must be generated from actual production count/DESeq2 artifacts. Until those artifacts exist, the UI shows the required stage rather than manufacturing a chart.</div>\n          <div><p className="mb-3 flex items-center gap-2 text-xs font-semibold text-text-primary"><Flask /> Production RNA-seq execution</p><RnaSeqProductionSupportCard /></div>\n        </>'''
          new = '''        <>\n          <div className="rounded-xl border border-accent-cyan/20 bg-accent-cyan/5 p-4 text-xs leading-5 text-text-secondary"><ShieldCheck className="mr-2 inline h-4 w-4 text-accent-cyan" /><strong className="text-text-primary">Expression statistics are now executed, not mocked.</strong> The workspace below accepts raw integer counts plus explicit sample metadata and emits R/DESeq2 tables and R-generated figures. The upstream FASTQ production lane remains separate and continues through nf-core/rnaseq.</div>\n          <RnaSeqExpressionWorkspace />\n          <div><p className="mb-3 flex items-center gap-2 text-xs font-semibold text-text-primary"><Flask /> Upstream production RNA-seq execution</p><RnaSeqProductionSupportCard /></div>\n        </>'''
          if text.count(old) != 1:
              raise SystemExit('RNA tab block match failed')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit workspace integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bioai-platform/frontend/src/components/ngs/GuidedNgsWorkspace.tsx
          git diff --cached --exit-code && exit 0
          git commit -m "feat(rnaseq): surface real DESeq2 analysis in NGS workspace"
          git push origin HEAD:feature/rnaseq-deseq2-execution-2026-09-12
