name: Scientific integrity gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/scientific-integrity-polish]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and type safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bioai-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bioai-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  ngs-integrity:
    name: NGS scientific contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bioai-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install NGS test dependencies
        run: python -m pip install --upgrade pip pytest fastapi 'pydantic[email]' numpy httpx2
      - name: Run NGS contract and stage suite
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_ngs_platform.py
