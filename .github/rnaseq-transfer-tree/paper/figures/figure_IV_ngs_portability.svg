<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150" role="img" aria-labelledby="title desc">
<title id="title">Figure IV. Compact synthetic NGS portability benchmark</title><desc id="desc">Bar chart showing precision, recall and F1 equal to one for BioNexus direct, Nextflow and a Galaxy wrapper command on one synthetic heterozygous SNP, with a prominent scope limitation.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17202a}.h{font-size:34px;font-weight:700}.s{font-size:21px;font-weight:700}.b{font-size:17px}.m{font-size:15px;fill:#4b5563}.axis{stroke:#263238;stroke-width:2}.grid{stroke:#d7dde1;stroke-width:1}.bar1{fill:#315c83}.bar2{fill:#26695c}.bar3{fill:#8a6d1d}.note{fill:#fff8e7;stroke:#8a6d1d;stroke-width:2}.box{fill:#fff;stroke:#263238;stroke-width:2}</style>
<text x="90" y="70" class="h">Compact NGS portability fixture</text><text x="90" y="105" class="m">One synthetic heterozygous SNP in a 200 bp target; 20 mapped reads; expected chrTiny:50 C&gt;G, GT=0/1, DP=20, AD=10,10.</text>

<line x1="220" y1="780" x2="1510" y2="780" class="axis"/><line x1="220" y1="250" x2="220" y2="780" class="axis"/>
<line x1="220" y1="250" x2="1510" y2="250" class="grid"/><line x1="220" y1="515" x2="1510" y2="515" class="grid"/>
<text x="160" y="785" class="m">0.0</text><text x="160" y="520" class="m">0.5</text><text x="160" y="255" class="m">1.0</text>
<text x="100" y="470" class="s" transform="rotate(-90 100 470)">Metric value</text>

<!-- BioNexus direct -->
<rect x="330" y="250" width="90" height="530" class="bar1"/><rect x="430" y="250" width="90" height="530" class="bar2"/><rect x="530" y="250" width="90" height="530" class="bar3"/>
<text x="345" y="235" class="b">1.00</text><text x="445" y="235" class="b">1.00</text><text x="545" y="235" class="b">1.00</text><text x="365" y="825" class="s">BioNexus direct</text>
<!-- Nextflow -->
<rect x="750" y="250" width="90" height="530" class="bar1"/><rect x="850" y="250" width="90" height="530" class="bar2"/><rect x="950" y="250" width="90" height="530" class="bar3"/>
<text x="765" y="235" class="b">1.00</text><text x="865" y="235" class="b">1.00</text><text x="965" y="235" class="b">1.00</text><text x="825" y="825" class="s">Nextflow</text>
<!-- Galaxy wrapper -->
<rect x="1170" y="250" width="90" height="530" class="bar1"/><rect x="1270" y="250" width="90" height="530" class="bar2"/><rect x="1370" y="250" width="90" height="530" class="bar3"/>
<text x="1185" y="235" class="b">1.00</text><text x="1285" y="235" class="b">1.00</text><text x="1385" y="235" class="b">1.00</text><text x="1170" y="825" class="s">Galaxy wrapper command*</text>

<rect x="250" y="890" width="420" height="82" rx="14" class="box"/><rect x="285" y="916" width="32" height="32" class="bar1"/><text x="330" y="940" class="b">Precision</text><rect x="410" y="916" width="32" height="32" class="bar2"/><text x="455" y="940" class="b">Recall</text><rect x="535" y="916" width="32" height="32" class="bar3"/><text x="580" y="940" class="b">F1</text>
<rect x="720" y="875" width="930" height="170" rx="16" class="note"/><text x="755" y="920" class="s">Scope limitation</text><text x="755" y="958" class="b">All three normalized call tables had the same recorded SHA-256 and TP=1, FP=0, FN=0.</text><text x="755" y="992" class="b">This tests one easy synthetic SNP only; indels, difficult regions, CNVs, SVs and real-sample QC were not tested.</text><text x="755" y="1026" class="m">*Galaxy wrapper/lint path completed; a Galaxy server execution was not completed. Do not infer platform-wide parity.</text>
</svg>