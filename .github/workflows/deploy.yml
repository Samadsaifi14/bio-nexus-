name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read

jobs:
  deploy-backend:
    name: Deploy Backend to HuggingFace Spaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U huggingface_hub
          printf '%s\n' "$GITHUB_SHA" > bioai-platform/backend/app/.source-revision
          hf upload Samad14/bio-nexus-api bioai-platform/backend --repo-type space --exclude "**/.env" --exclude "**/.env.deploy" --exclude "**/__pycache__/**"
      - name: Verify deployed backend revision and health
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          expected = os.environ["EXPECTED_REVISION"]
          url = "https://samad14-bio-nexus-api.hf.space/health"
          for attempt in range(45):
              try:
                  request = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=10) as response:
                      health = json.load(response)
                  revision = health.get("source_revision")
                  if health.get("status") == "ok" and revision == expected:
                      print(f"Healthy deployed backend revision verified: {expected}")
                      break
                  print(f"Waiting for revision {expected}; observed {revision or 'unreported'}")
              except Exception as exc:
                  print(f"Backend rebuild pending: {type(exc).__name__}")
              time.sleep(10)
          else:
              raise SystemExit("Expected backend revision did not become healthy")
          PY

      - name: Verify live GEO metadata and count-matrix preparation
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "https://samad14-bio-nexus-api.hf.space"

          def request(path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              headers = {"Cache-Control": "no-cache"}
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=headers, method="POST" if data is not None else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"Live GEO smoke failed ({exc.code}) {path}: {detail}") from exc

          series = request("/api/ngs/v2/geo/series/GSE336901")
          assert series.get("accession") == "GSE336901", "GEO returned the wrong Series accession"
          assert len(series.get("samples", [])) == 10, f"Expected 10 GEO samples, got {len(series.get('samples', []))}"
          count_file = "GSE336901_Fig3_FFPE_raw_counts_matrix_GEO.csv.gz"
          assert any(file.get("name") == count_file and file.get("analysis_eligible") for file in series.get("files", [])), "The deposited raw-count supplement was not discovered as analysis-eligible"

          prepared = request("/api/ngs/v2/geo/prepare", {"accession": "GSE336901"})
          if prepared.get("status") == "ready":
              assert prepared.get("samples") == 10, f"Expected 10 prepared samples, got {prepared.get('samples')}"
              assert prepared.get("genes", 0) > 0, "The prepared count matrix contains no genes"
              assert len(prepared.get("groups", [])) == 2 and sorted(group.get("samples", 0) for group in prepared["groups"]) == [5, 5], f"Expected a 5-versus-5 comparison: {prepared.get('groups')}"
              capabilities = request("/api/ngs/v2/rnaseq/recovery/capabilities")
              counts_runtime = capabilities.get("counts", {})
              assert counts_runtime.get("available") is True, f"DESeq2 durable worker is not ready for the live example: {counts_runtime.get('missing', [])}"
              print(f"Live GEO verification passed: {series['accession']}, 10 samples, {prepared['genes']} genes, 5 vs 5 groups; DESeq2 worker ready.")
          elif prepared.get("status") == "raw_reads_available":
              fallback = prepared.get("raw_read_fallback", {})
              assert fallback.get("provider") == "European Nucleotide Archive", f"Unexpected raw-read provider: {fallback}"
              assert fallback.get("sample_count") == 10 and fallback.get("run_count") == 10, f"Expected 10 mapped ENA runs: {fallback}"
              assert fallback.get("fastq_file_count") == 20 and fallback.get("paired_end") is True, f"Expected 20 paired-end FASTQ files: {fallback}"
              assert len({run.get("sample_accession") for run in fallback.get("runs", [])}) == 10, "ENA runs do not map uniquely to all GEO samples"
              assert all(len(run.get("fastq_files", [])) == 2 and all(file.get("md5") and file.get("bytes", 0) > 0 for file in run["fastq_files"]) for run in fallback["runs"]), "ENA FASTQ checksums or sizes are incomplete"
              assert prepared.get("analysis_status") == "NOT_EVALUATED", "Raw-read fallback must not be presented as a completed count analysis"
              print(f"Live GEO recovery DEGRADED: {series['accession']} metadata verified; GEO count supplement unavailable; {fallback['run_count']} ENA paired-end runs mapped to {fallback['sample_count']} samples; DESeq2 NOT_EVALUATED.")
          else:
              raise SystemExit(f"Live GEO retrieval returned an unsupported state: {prepared}")
          PY

  deploy-frontend:
    name: Verify production frontend deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the canonical Vercel project to deploy this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..40}; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '.statuses[] | select(.context == "Vercel – bio-nexus") | .state' | head -n 1)"
            case "$state" in
              success) echo "Canonical Vercel deployment succeeded for $GITHUB_SHA"; exit 0 ;;
              failure|error) echo "Canonical Vercel deployment failed for $GITHUB_SHA"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for canonical Vercel deployment of $GITHUB_SHA"
          exit 1
      - name: Verify public frontend response
        run: |
          curl --fail --silent --show-error --max-time 20 \
            https://bio-nexus-ebon.vercel.app/ \
            -o /tmp/bionexus-home.html
          test -s /tmp/bionexus-home.html
          curl --fail --silent --show-error --max-time 20 \
            https://bio-nexus-ebon.vercel.app/robots.txt \
            -o /tmp/bionexus-robots.txt
          test -s /tmp/bionexus-robots.txt
