name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to HuggingFace Spaces
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U huggingface_hub
          hf upload Samad14/bio-nexus-api bioai-platform/backend --repo-type space --exclude "**/.env" --exclude "**/.env.deploy" --exclude "**/__pycache__/**"

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bioai-platform/frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_y6MYl4hpatRBHMHSwAzCzQ5f
      VERCEL_PROJECT_ID: prj_ylJFEbddC3dQsqLVsKyhMWDMHqeG
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Pull production project settings
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build production frontend
        run: npx vercel build --prod --token "$VERCEL_TOKEN"
      - name: Deploy production frontend
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
