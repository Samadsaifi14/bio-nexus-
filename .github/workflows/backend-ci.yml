name: backend-ci

# Automatic validation for deterministic scientific contracts, provenance,
# production NGS execution boundaries and security-sensitive request handling.
on:
  push:
    paths:
      - 'bioai-platform/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'bioai-platform/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bioai-platform/backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep CI deterministic with the lightweight runtime/test dependencies
          # exercised by these suites. Heavy providers are tested behind adapters.
          pip install pytest pytest-asyncio fastapi 'httpx>=0.24' biopython numpy python-dotenv slowapi 'pydantic[email]' pillow supabase python-multipart

      - name: Deterministic validation suite
        run: |
          python -m pytest tests/test_benchmarks_compare.py \
            tests/test_experiment_provenance.py \
            tests/test_blast_engine.py \
            tests/test_blast_program_matrix.py \
            tests/test_blast_resilience.py \
            tests/test_uniprot_engine.py \
            tests/test_msa_engine.py \
            tests/test_phylo_engine.py \
            tests/test_domains_engine.py \
            tests/test_alphafold_pathway_engines.py \
            tests/test_page_capture_synthesis.py \
            tests/test_publication_engine.py \
            tests/test_interpret_engine.py \
            tests/test_evidence_engine.py \
            tests/test_figure_engine.py \
            tests/test_lifespan_worker.py \
            tests/test_ngs_v2_router.py \
            tests/test_ngs_production_execution.py \
            tests/test_ngs_security_boundaries.py \
            tests/test_ngs_paired_preview.py \
            tests/test_ngs_demo_downloads.py \
            tests/test_ngs_guided_pipeline.py \
            tests/test_ngs_lecture_contracts.py \
            tests/test_geo_counts_import.py \
            tests/test_geo_search.py \
            tests/test_rnaseq_expression_contract.py \
            tests/test_enrichment_retry.py \
            tests/test_rnaseq_production.py \
            -q

      - name: Benchmark + engine registry integrity
        run: |
          python scripts/ci_validate.py

  rnaseq-r:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bioai-platform/backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install local RNA-seq statistical and annotation runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-bioc-deseq2 r-bioc-complexheatmap r-cran-ggplot2 r-cran-jsonlite r-cran-circlize r-bioc-org.hs.eg.db r-cran-biocmanager r-bioc-go.db
          sudo Rscript -e 'BiocManager::install("org.Mm.eg.db", ask = FALSE, update = FALSE); stopifnot(requireNamespace("org.Mm.eg.db", quietly = TRUE))'
      - name: Known-answer GO statistics and real identifier mapping
        run: Rscript tests/test_go_enrichment.R
      - name: Execute the ten-stage SALS regression fixture
        run: |
          mkdir -p /tmp/rnaseq-smoke
          Rscript app/rnaseq/deseq2_analysis.R app/data/rnaseq/Cer_SALS_every100_validation_subset.tsv app/data/rnaseq/Cer_SALS_metadata.tsv /tmp/rnaseq-smoke condition healthy SALS "" 0.05 1 10 8:40 human
          Rscript -e 's <- jsonlite::fromJSON("/tmp/rnaseq-smoke/analysis_summary.json"); stopifnot(s$samples == 18, s$genes_input == 221, s$enrichment$background_genes > 0, s$enrichment$status %in% c("SUCCEEDED", "NO_SIGNIFICANT_TERMS", "NO_TESTABLE_TERMS")); for (f in c("pca.svg", "sample_distance_heatmap.svg", "volcano.svg", "expression_heatmap.svg", "deseq2_all_results.tsv", "go_enrichment_all.tsv", "go_gene_mapping.tsv", "go_background.tsv", "go_annotation_metadata.json")) stopifnot(file.exists(file.path("/tmp/rnaseq-smoke", f)))'
