name: One-time BLAST false de-novo fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-blast-false-denovo.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch BLAST result integrity guards
        shell: python
        run: |
          from pathlib import Path

          pipeline = Path('bioai-platform/backend/app/routers/pipeline_v2.py')
          text = pipeline.read_text()

          old = '''        zero_hits = result.get("count", 0) == 0
        if zero_hits and (detect_sequence_type(sequence) or "protein") == "protein":
            # Tier 6: no database match at all — characterize from sequence
            # alone instead of failing the run (techspec.md §1).
            denovo_mode = True
            result["_note"] = "No BLAST hits found — switching to de novo characterization"
            _mark("blast", "complete", progress=100, data=result)
        else:
            _mark("blast", "failed" if zero_hits else "complete", progress=100, data=result)
            if zero_hits:
                _failed_step = "blast"
                _failed_error = result.get("error", "No BLAST hits found")
        context["blast"] = result
'''
          new = '''        provider_failed = bool(result.get("error")) or result.get("search_complete") is False
        zero_hits = result.get("count", 0) == 0
        confirmed_zero_hits = zero_hits and not provider_failed

        if confirmed_zero_hits and (detect_sequence_type(sequence) or "protein") == "protein":
            # Tier 6 is entered only after a BLAST provider completed normally
            # and returned zero hits. Provider outages/timeouts must never be
            # interpreted as biological novelty.
            denovo_mode = True
            result["_note"] = "Completed BLAST search returned no hits — switching to de novo characterization"
            _mark("blast", "complete", progress=100, data=result)
        else:
            blast_failed = provider_failed or zero_hits
            _mark("blast", "failed" if blast_failed else "complete", progress=100, data=result)
            if blast_failed:
                _failed_step = "blast"
                _failed_error = result.get("error", "BLAST completed without usable hits")
        context["blast"] = result
'''
          if old not in text:
              raise SystemExit('pipeline zero-hit block not found; refusing unsafe patch')
          text = text.replace(old, new, 1)

          old = '''    return {
        "count": len(hits),
        "source": source,
'''
          new = '''    return {
        "count": len(hits),
        "search_complete": True,
        "source": source,
'''
          if old not in text:
              raise SystemExit('canonical BLAST result block not found')
          text = text.replace(old, new, 1)

          old = '''    logger.warning("EBI BLAST unavailable and NCBI failed (%s)", ncbi_error)
    return {"error": ncbi_error or "BLAST failed via EBI and NCBI", "count": 0, "hits": []}
'''
          new = '''    logger.warning("EBI BLAST unavailable and NCBI failed (%s)", ncbi_error)
    return {
        "error": ncbi_error or "BLAST failed via EBI and NCBI",
        "count": 0,
        "hits": [],
        "search_complete": False,
    }
'''
          if old not in text:
              raise SystemExit('BLAST failure return block not found')
          text = text.replace(old, new, 1)

          old = '''        return {"error": str(e), "count": 0, "hits": []}
'''
          new = '''        return {"error": str(e), "count": 0, "hits": [], "search_complete": False}
'''
          if old not in text:
              raise SystemExit('BLAST parameter failure return not found')
          text = text.replace(old, new, 1)
          pipeline.write_text(text)

          synthesis = Path('bioai-platform/backend/app/services/final_synthesis.py')
          text = synthesis.read_text()
          old = '''    elif blast.get("count", 0) == 0:
        findings.append({
            "claim": "No significant similarity to any database sequence.",
'''
          new = '''    elif blast.get("search_complete") is True and blast.get("count", 0) == 0:
        findings.append({
            "claim": "No significant similarity was found in the completed BLAST search.",
'''
          if old not in text:
              raise SystemExit('final synthesis zero-hit claim not found')
          text = text.replace(old, new, 1)
          synthesis.write_text(text)

          blast_tool = Path('bioai-platform/backend/app/tools/blast.py')
          text = blast_tool.read_text()
          old = '''        if last_error:
            logger.warning("EBI BLAST JSON retrieval failed for %s: %s", job_id, last_error)
        return []
'''
          new = '''        if last_error:
            logger.warning("EBI BLAST JSON retrieval failed for %s: %s", job_id, last_error)
            raise RuntimeError(f"EBI BLAST JSON retrieval failed: {last_error}") from last_error
        return []
'''
          if old not in text:
              raise SystemExit('EBI JSON retrieval fallback block not found')
          text = text.replace(old, new, 1)

          old = '''        except Exception as exc:
            logger.warning("EBI BLAST XML fallback failed for %s: %s", job_id, exc)
            return []
'''
          new = '''        except Exception as exc:
            logger.warning("EBI BLAST XML fallback failed for %s: %s", job_id, exc)
            raise RuntimeError(f"EBI BLAST XML retrieval failed: {exc}") from exc
'''
          if old not in text:
              raise SystemExit('EBI XML fallback block not found')
          text = text.replace(old, new, 1)
          blast_tool.write_text(text)

          test = Path('bioai-platform/backend/tests/test_blast_false_denovo_guard.py')
          test.write_text('''import asyncio\n\n\ndef test_provider_error_is_not_treated_as_denovo(monkeypatch):\n    from app.routers import pipeline_v2 as pv\n\n    job_id = "guard-test"\n    seq = "MEEPQSDPSVEPPLSQETFSDLWKLLPENNVLSPLPSQAMDDLMLSPDDIEQWFTEDPGPDEA"\n    pv._jobs[job_id] = {\n        "job_id": job_id, "status": "running", "steps": {\n            s: {"status": "pending", "progress": 0, "data": None, "error": None}\n            for s in pv.STEP_ORDER\n        }, "requested_steps": ["blast"], "sequence": seq, "error": None,\n    }\n\n    async def fake_blast(*args, **kwargs):\n        return {"error": "provider timeout", "count": 0, "hits": [], "search_complete": False}\n\n    async def forbidden_denovo(*args, **kwargs):\n        raise AssertionError("de novo branch must not run on provider failure")\n\n    monkeypatch.setattr(pv, "_run_blast", fake_blast)\n    monkeypatch.setattr(pv, "_run_denovo_steps", forbidden_denovo)\n    monkeypatch.setattr(pv, "_persist_v2_final", lambda *a, **k: None)\n    monkeypatch.setattr(pv, "_capture_run_sources", lambda *a, **k: None)\n\n    asyncio.run(pv._execute(job_id, seq, ["blast"]))\n    job = pv._jobs[job_id]\n    assert job["status"] == "failed"\n    assert "provider timeout" in job["error"]\n    assert job["steps"]["blast"]["status"] == "failed"\n    pv._jobs.pop(job_id, None)\n''')

          # One-time workflow: remove itself in the same commit as the fix.
          Path('.github/workflows/fix-blast-false-denovo.yml').unlink()

      - name: Syntax and patch assertions
        run: |
          python -m py_compile \
            bioai-platform/backend/app/routers/pipeline_v2.py \
            bioai-platform/backend/app/services/final_synthesis.py \
            bioai-platform/backend/app/tools/blast.py \
            bioai-platform/backend/tests/test_blast_false_denovo_guard.py
          grep -q 'provider_failed = bool(result.get("error"))' bioai-platform/backend/app/routers/pipeline_v2.py
          grep -q 'search_complete": True' bioai-platform/backend/app/routers/pipeline_v2.py
          grep -q 'blast.get("search_complete") is True' bioai-platform/backend/app/services/final_synthesis.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(blast): prevent provider failures from becoming de novo results"
          git push origin HEAD:main
