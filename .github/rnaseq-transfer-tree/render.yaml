services:
  - type: web
    name: bio-nexus-api
    runtime: python
    region: ohio
    rootDir: bioai-platform/backend
    buildCommand: bash build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGIN
        value: "https://bio-nexus-ebon.vercel.app"
      # Ensure the in-process durable worker starts so queued jobs (BLAST,
      # docking, NGS, MD) are always claimed. Without this the worker can be
      # silently disabled and every job stays stuck in "queued".
      - key: RUN_WORKER
        value: "true"
