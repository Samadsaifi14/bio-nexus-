name: backend-ci

# Automatic validation for deterministic scientific contracts, provenance,
# production NGS execution boundaries and security-sensitive request handling.
on:
  push:
    paths:
      - 'bioai-platform/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'bioai-platform/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bioai-platform/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep CI deterministic with the lightweight runtime/test dependencies
          # exercised by these suites. Heavy providers are tested behind adapters.
          pip install pytest fastapi 'httpx>=0.24' biopython numpy python-dotenv slowapi 'pydantic[email]' pillow supabase

      - name: Deterministic validation suite
        run: |
          python -m pytest tests/test_benchmarks_compare.py \
            tests/test_experiment_provenance.py \
            tests/test_blast_engine.py \
            tests/test_uniprot_engine.py \
            tests/test_msa_engine.py \
            tests/test_phylo_engine.py \
            tests/test_domains_engine.py \
            tests/test_alphafold_pathway_engines.py \
            tests/test_interpret_engine.py \
            tests/test_evidence_engine.py \
            tests/test_figure_engine.py \
            tests/test_lifespan_worker.py \
            tests/test_ngs_v2_router.py \
            tests/test_ngs_production_execution.py \
            tests/test_ngs_security_boundaries.py \
            tests/test_ngs_paired_preview.py \
            tests/test_ngs_demo_downloads.py \
            tests/test_ngs_guided_pipeline.py \
            -q

      - name: Benchmark + engine registry integrity
        run: |
          python scripts/ci_validate.py
